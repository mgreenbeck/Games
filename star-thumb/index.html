<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05060f">
<title>Star Thumb</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, bgCache = null;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const FONT = 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif';

/* ================= ships ================= */
const SHIPS = [
  { name: 'SWIFT', desc: ['Fast & nimble', '2 lives · tiny'], col: '#3dffa0', shape: 'swift', sens: 1.9, lives: 2, dmg: 1, rate: 0.9, hit: 4 },
  { name: 'ACE',   desc: ['All-rounder', '3 lives'],          col: '#2bd9ff', shape: 'ace',   sens: 1.5, lives: 3, dmg: 1, rate: 1,   hit: 5 },
  { name: 'TITAN', desc: ['Double-damage gun', 'Slow · big'], col: '#ff9f1c', shape: 'titan', sens: 1.15, lives: 3, dmg: 2, rate: 1.2, hit: 7 }
];

/* ================= zones ================= */
const ZONES = [
  { name: 'DEEP SPACE', bg: ['#04050d', '#070a1c'], star: '200,220,255', deco: null,
    pal: { grunt: '#ff4d6d', zig: '#c86bff', shooter: '#ffd23f', tank: '#3dd68c', diver: '#4d9dff', bonus: '#ffe14d' } },
  { name: 'NEBULA', bg: ['#0d0418', '#2a0b3a'], star: '255,205,240', deco: 'nebula',
    pal: { grunt: '#ff7a59', zig: '#5ce1ff', shooter: '#fff275', tank: '#7bff8a', diver: '#ff5ec4', bonus: '#ffe14d' } },
  { name: 'ASTEROID FIELD', bg: ['#0a0806', '#1c150d'], star: '255,230,200', deco: 'rocks',
    pal: { grunt: '#ff3b3b', zig: '#ffa63d', shooter: '#f0f0f0', tank: '#9bd14b', diver: '#3dd6ff', bonus: '#ffe14d' } },
  { name: 'ION STORM', bg: ['#020f10', '#063028'], star: '180,255,230', deco: 'storm',
    pal: { grunt: '#ff4dd2', zig: '#ffe14d', shooter: '#ff7a3d', tank: '#6d8dff', diver: '#ff4d6d', bonus: '#ffffff' } }
];

/* ================= settings (optional storage) ================= */
let best = 0, muted = false, musicOff = false, shipIdx = 1;
try {
  best = +localStorage.getItem('starthumb_best') || 0;
  muted = localStorage.getItem('starthumb_mute') === '1';
  musicOff = localStorage.getItem('starthumb_music') === '0';
  shipIdx = clamp(+(localStorage.getItem('starthumb_ship') ?? 1) || 0, 0, 2);
} catch (e) {}
function save() {
  try {
    localStorage.setItem('starthumb_best', best);
    localStorage.setItem('starthumb_mute', muted ? '1' : '0');
    localStorage.setItem('starthumb_music', musicOff ? '0' : '1');
    localStorage.setItem('starthumb_ship', shipIdx);
  } catch (e) {}
}

/* ================= audio ================= */
let AC = null, noiseBuf = null, OUT = null, MUS = null, voices = 0;
const MAXV = 16;
function initAudio() {
  if (AC) { if (AC.state !== 'running') AC.resume().catch(() => {}); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    OUT = AC.createDynamicsCompressor(); OUT.connect(AC.destination);
    MUS = AC.createGain(); MUS.gain.value = 0.55; MUS.connect(OUT);
    AC.resume().catch(() => {});
    const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0);
    const len = AC.sampleRate * 0.6;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function canPlay(c) { return AC && !muted && AC.state !== 'closed' && voices + c <= MAXV; }
function hold(c, d) { voices += c; setTimeout(() => { voices = Math.max(0, voices - c); }, d * 1000 + 60); }
function tone(f, d, type, v, f2) {
  if (!canPlay(1)) return; hold(1, d);
  try {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(OUT); o.start(t); o.stop(t + d);
  } catch (e) {}
}
function boom(v, d) {
  if (!noiseBuf || !canPlay(1)) return; hold(1, d);
  try {
    const t = AC.currentTime, s = AC.createBufferSource(), g = AC.createGain(), fl = AC.createBiquadFilter();
    s.buffer = noiseBuf; fl.type = 'lowpass';
    fl.frequency.setValueAtTime(2000, t); fl.frequency.exponentialRampToValueAtTime(100, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl).connect(g).connect(OUT); s.start(t); s.stop(t + d);
  } catch (e) {}
}
function crackle(v, d) {
  if (!noiseBuf || !canPlay(1)) return; hold(1, d);
  try {
    const t = AC.currentTime, s = AC.createBufferSource(), g = AC.createGain(), hp = AC.createBiquadFilter(), lp = AC.createBiquadFilter();
    s.buffer = noiseBuf; s.playbackRate.value = rnd(0.7, 1.4);
    hp.type = 'highpass'; hp.frequency.value = 500;
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(rnd(4000, 7000), t); lp.frequency.exponentialRampToValueAtTime(400, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(hp).connect(lp).connect(g).connect(OUT); s.start(t, rnd(0, 0.3)); s.stop(t + d);
  } catch (e) {}
}
let lastTak = 0, lastBossPop = 0, shotN = 0;
const blip = (f, d, v, f2, type) => tone(f, d, type || 'square', v, f2);
const tik = () => blip(rnd(1500, 1800), 0.025, 0.03, 700);
function tak() { const n = performance.now(); if (n - lastTak < 55) return; lastTak = n; blip(rnd(260, 340), 0.04, 0.06, 120); }
function tinyBoom(v) { crackle(v || 0.18, rnd(0.08, 0.16)); blip(rnd(180, 260), 0.09, 0.05, 50); }
function popKill(big) {
  if (big) { blip(500, 0.2, 0.07, 60); boom(0.22, 0.35); }
  else { blip(rnd(600, 900), 0.1, 0.06, 90); crackle(0.12, 0.12); }
}
function arp(notes, step, v, type) { notes.forEach((f, i) => setTimeout(() => blip(f, step * 1.4, v, 0, type), i * step * 1000)); }
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

let laserNodes = null;
function laserHum(dur) {
  stopLaserHum();
  if (!AC || muted || dur <= 0.05) return;
  try {
    const t = AC.currentTime, o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 110; o2.type = 'square'; o2.frequency.value = 221;
    lp.type = 'lowpass'; lp.frequency.value = 1300;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.05);
    g.gain.setValueAtTime(0.06, t + Math.max(0.06, dur - 0.15)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); o2.connect(lp); lp.connect(g).connect(OUT);
    o.start(t); o2.start(t); o.stop(t + dur); o2.stop(t + dur);
    laserNodes = { o, o2, g };
  } catch (e) {}
}
function stopLaserHum() {
  if (!laserNodes) return;
  try { const t = AC.currentTime; laserNodes.g.gain.cancelScheduledValues(t); laserNodes.g.gain.setValueAtTime(0.0001, t); laserNodes.o.stop(t + 0.02); laserNodes.o2.stop(t + 0.02); } catch (e) {}
  laserNodes = null;
}

/* ---------- chiptune music ---------- */
const SONGS = {
  normal: { bpm: 132, ch: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], lead: [0, 1, 2, 1, 2, 1, 0, 2], drive: false },
  boss:   { bpm: 168, ch: [[50, 53, 57], [46, 50, 53], [48, 52, 55], [45, 49, 52]], lead: [0, 2, 1, 2, 0, 2, 1, 2], drive: true },
  bonus:  { bpm: 150, ch: [[60, 64, 67], [65, 69, 72], [67, 71, 74], [60, 64, 67]], lead: [0, 1, 2, 1, 0, 2, 1, 2], drive: false }
};
let musMode = null, musStep = 0, musNext = 0;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function mnote(f, t, d, type, v) {
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(MUS); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
function mnoise(t, d, v, f) {
  try {
    const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; fl.type = 'highpass'; fl.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl).connect(g).connect(MUS); s.start(t, Math.random() * 0.4); s.stop(t + d);
  } catch (e) {}
}
function musicStep(song, s, t) {
  const i = s % 16, ch = song.ch[Math.floor(s / 16) % 4];
  if (song.drive) mnote(mtof(ch[0] - 24 + (i % 2 ? 12 : 0)), t, 0.1, 'triangle', 0.24);
  else if (i % 2 === 0) mnote(mtof(ch[0] - 12), t, 0.2, 'triangle', 0.24);
  if (i % 2 === 0) mnote(mtof(ch[song.lead[(i / 2) % 8]] + 12), t, 0.13, 'square', 0.035);
  else if (song.drive) mnote(mtof(ch[song.lead[((i - 1) / 2) % 8]] + 24), t, 0.06, 'square', 0.018);
  if (i % 4 === 2) mnoise(t, 0.04, 0.05, 7000);
  if (i % 8 === 4) mnoise(t, 0.12, 0.08, 1500);
  if (song.drive && i % 4 === 0) mnote(65, t, 0.12, 'sine', 0.35);
}
function musicTick() {
  const want = (!AC || musicOff) ? null
    : (state === 'play' && idle < 0.25) ? (bonus && bonus.started ? 'bonus' : boss ? 'boss' : 'normal') : null;
  if (want !== musMode) { musMode = want; musStep = 0; if (AC) musNext = AC.currentTime + 0.06; }
  if (!musMode || !AC || AC.state !== 'running' || !noiseBuf) return;
  const song = SONGS[musMode], st = 60 / song.bpm / 4;
  if (musNext < AC.currentTime) musNext = AC.currentTime + 0.02;
  while (musNext < AC.currentTime + 0.15) { musicStep(song, musStep, musNext); musNext += st; musStep++; }
}

/* ================= world ================= */
const stars = [];
for (let i = 0; i < 100; i++) stars.push({ x: Math.random(), y: Math.random(), z: rnd(0.15, 1) });
const blobs = [];
for (let i = 0; i < 6; i++) blobs.push({ x: Math.random(), y: Math.random(), r: rnd(0.25, 0.5), c: ['#8a2be2', '#ff3d9a', '#3d5cff'][i % 3] });
const rocks = [];
for (let i = 0; i < 14; i++) { const pts = []; for (let k = 0; k < 8; k++) pts.push(rnd(0.7, 1.15)); rocks.push({ x: Math.random(), y: Math.random(), z: rnd(0.3, 0.9), s: rnd(8, 30), rot: rnd(0, 6), vr: rnd(-0.6, 0.6), pts }); }
let bolt = null, boltT = 3;

let levelBase = 1, levelT = 0, zaps = [], rings = [];
let state = 'menu', P = null, pb, eb, en, pu, parts, texts, banners, score, gtime, spawnT, bossT, boss, bossCount, zone = 0, combo, comboT, maxMult, bonus = null;
let shakeT = 0, shakeM = 0, flashT = 0, overT = 0, newBest = false;

function reset() {
  const S = SHIPS[shipIdx];
  P = { x: W / 2, y: H - 120, lvl: 1, shield: 0, inv: 1.5, lives: S.lives, bombs: 1, fireT: 0, mT: 0, wings: [], laser: 0, slow: 0, magnet: 0, ship: S };
  pb = []; eb = []; en = []; pu = []; parts = []; texts = []; banners = []; zaps = []; rings = [];
  levelBase = 1; levelT = 0;
  score = 0; gtime = 0; spawnT = 1; bossT = 45; boss = null; bossCount = 0; zone = 0;
  combo = 0; comboT = 0; maxMult = 1; bonus = null; shakeT = 0; flashT = 0;
}
function startGame() {
  reset(); state = 'play'; idle = 0;
  banner('ZONE 1 · ' + ZONES[0].name, 2, '#fff');
  arp([523, 659, 784, 1047], 0.06, 0.06);
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgCache = null;
  if (P) { P.x = clamp(P.x, 14, W - 14); P.y = clamp(P.y, 40, H - 24); }
}
resize(); reset();

/* ================= buttons ================= */
function pill(id, x, y, w, h, label, col, solid) { return { id, x, y, w, h, label, col, solid }; }
function soundPills(y) {
  const w = Math.min(130, (W - 36) / 2), g = 12, x0 = W / 2 - w - g / 2;
  return [
    pill('sfx', x0, y, w, 38, muted ? '🔇 SFX OFF' : '🔊 SFX ON', muted ? '#ff4d6d' : '#2bd9ff'),
    pill('music', x0 + w + g, y, w, 38, musicOff ? '🎵 MUSIC OFF' : '🎵 MUSIC ON', musicOff ? '#ff4d6d' : '#2bd9ff')
  ];
}
function menuLayout() {
  const titleY = Math.max(48, H * 0.09);
  const cw = (W - 40) / 3, ch = Math.min(150, Math.max(110, H * 0.2)), cy = titleY + 44;
  const cards = [0, 1, 2].map(i => pill('ship' + i, 10 + i * (cw + 10), cy, cw, ch));
  const instrY = cy + ch + 28, legendY = instrY + 3 * 21 + 12;
  const pillsY = Math.max(legendY + 44, H - 170);
  const start = pill('start', W / 2 - 110, pillsY + 54, 220, 54, 'START', '#2bd9ff', true);
  return { titleY, cards, instrY, legendY, pillsY, start };
}
function overLayout() {
  const y = Math.max(H * 0.52, H * 0.3 + 150);
  return {
    again: pill('again', W / 2 - 110, y, 220, 52, 'PLAY AGAIN', '#2bd9ff', true),
    ships: pill('ships', W / 2 - 110, y + 64, 220, 44, 'CHANGE SHIP', '#ffffff'),
    pillsY: y + 124
  };
}
function buttons() {
  if (state === 'menu') { const L = menuLayout(); return [...L.cards, ...soundPills(L.pillsY), L.start]; }
  if (state === 'over') { if (performance.now() - overT < 900) return []; const L = overLayout(); return [L.again, L.ships, ...soundPills(L.pillsY)]; }
  if (state === 'play' && idle >= 0.25) return soundPills(H / 2 + 62);
  return [];
}
function handleBtn(id) {
  if (id === 'sfx') { muted = !muted; save(); if (muted) stopLaserHum(); else blip(660, 0.12, 0.08, 990, 'sine'); return false; }
  if (id === 'music') { musicOff = !musicOff; save(); return false; }
  if (id.startsWith('ship')) { shipIdx = +id.slice(4); save(); arp([660, 990], 0.05, 0.05); return false; }
  if (id === 'start' || id === 'again') { startGame(); return true; }
  if (id === 'ships') { state = 'menu'; return false; }
  return false;
}

/* ================= input (one thumb) ================= */
let touching = false, pid = null, lx = 0, ly = 0, lastDown = 0, idle = 0, wasPaused = false;
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const now = performance.now(), x = e.clientX, y = e.clientY;
  const hit = buttons().find(b => x > b.x - 6 && x < b.x + b.w + 6 && y > b.y - 6 && y < b.y + b.h + 6);
  if (hit) { if (!handleBtn(hit.id)) return; lastDown = 0; }
  else if (state === 'menu') return;
  else if (state === 'over') { if (now - overT < 900) return; startGame(); lastDown = 0; }
  else if (state === 'play') { if (touching) return; if (now - lastDown < 300) useBomb(); }
  if (state !== 'play') return;
  lastDown = now;
  pid = e.pointerId; touching = true; lx = x; ly = y;
  try { cv.setPointerCapture(pid); } catch (_) {}
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (!touching || e.pointerId !== pid || state !== 'play') return;
  const s = P.ship.sens;
  P.x = clamp(P.x + (e.clientX - lx) * s, 14, W - 14);
  P.y = clamp(P.y + (e.clientY - ly) * s, 40, H - 24);
  lx = e.clientX; ly = e.clientY;
});
function release(e) { if (e.pointerId === pid) { touching = false; pid = null; } }
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('lostpointercapture', release);
document.addEventListener('visibilitychange', () => { if (document.hidden) { touching = false; pid = null; idle = 1; } });
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resize);

/* ================= helpers ================= */
function shake(t, m) { if (t >= shakeT) shakeM = m; else shakeM = Math.max(shakeM, m); shakeT = Math.max(shakeT, t); }
function banner(t, d, c) { banners.push({ s: t, t: d, d, c: c || '#fff' }); }
function explode(x, y, c, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(30, spd || 260), l = rnd(0.3, 0.9);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, c, sz: rnd(1.5, 3.8) });
  }
}
function floatText(x, y, s, c) { texts.push({ x, y, s, c: c || '#fff', t: 0.9 }); }
const comboMult = () => Math.min(8, 1 + Math.floor(combo / 6));

/* ================= weapons ================= */
const PATTERNS = {
  1: [[0, 0]],
  2: [[-7, 0], [7, 0]],
  3: [[-7, 0], [7, 0], [-4, -0.17], [4, 0.17]],
  4: [[-9, 0], [0, 0], [9, 0], [-5, -0.2], [5, 0.2]],
  5: [[-9, 0], [0, 0], [9, 0], [-5, -0.18], [5, 0.18], [-7, -0.4], [7, 0.4]]
};
// each wingman power-up swaps it to its next weapon (gold pair and rocket pair have their own lists)
const WG = { blaster: ['blaster', 'twin', 'ricochet', 'wave', 'spread'], rocket: ['missiles', 'dmissiles', 'flak', 'plasma', 'railgun'] };
const WING_MAX = 5;
const wingGun = w => WG[w.kind][w.lvl - 1];
const wingGunName = g => g === 'dmissiles' ? 'TWIN MISSILES' : g.toUpperCase();
const wingGunCol = g => GC[g === 'dmissiles' ? 'missiles' : g];
const WING_SLOTS = [
  { side: -1, off: 34, kind: 'blaster' }, { side: 1, off: 34, kind: 'blaster' },
  { side: -1, off: 64, kind: 'rocket' },  { side: 1, off: 64, kind: 'rocket' }
];
const WING_COUNT = WING_SLOTS.length;
const WING_COL = '#ffd23f', ROCKET_COL = '#ff6b3d';
// main-ship gun ladder: every level is a different weapon; the spread gun is the final one
const GC = { blaster: '#7ff3ff', twin: '#7ff3ff', shotgun: '#ffe6a8', missiles: '#ff6b3d', ricochet: '#ff7ad9', boomerang: '#ffcc00',
             plasma: '#c07bff', wave: '#3dffa0', blades: '#c9d1e0', flak: '#ff8a5c', mines: '#ff4d6d', lightning: '#fff36b',
             blackhole: '#9b5cff', railgun: '#e8fbff', spread: '#ff9f1c' };
const GUN_ORDER = ['blaster', 'twin', 'shotgun', 'missiles', 'ricochet', 'boomerang', 'plasma', 'wave', 'blades',
                   'flak', 'mines', 'lightning', 'blackhole', 'railgun', 'spread'];
const GUNS = [null, ...GUN_ORDER.map(id => ({ id, name: id === 'blackhole' ? 'BLACK HOLE' : id.toUpperCase(), col: GC[id] }))];
const MAIN_MAX = GUNS.length - 1;   // 15
const SHIELD_TIME = 12, SHIELD_HIT_COST = 3, LASER_TIME = 4, SLOW_TIME = 5, MAGNET_TIME = 10;
const wingCol = w => w.kind === 'rocket' ? ROCKET_COL : WING_COL;
function fullyMaxed() { return P.lvl >= MAIN_MAX && P.wings.length >= WING_COUNT && P.wings.every(w => w.lvl >= WING_MAX); }

function mainFire() {                 // fires the current main gun, returns seconds until next shot
  const dm = P.ship.dmg;
  const shot = (dx, a, sp, extra) => pb.push(Object.assign({ x: P.x + dx, y: P.y - 14, vx: Math.sin(a) * (sp || 760), vy: -Math.cos(a) * (sp || 760), dmg: dm, heavy: dm > 1 }, extra || {}));
  const tick = (n) => { if (++shotN % n === 0) tik(); };
  switch (GUNS[P.lvl].id) {
    case 'blaster':  shot(0, 0); tick(2); return 0.11;
    case 'twin':     shot(-7, 0); shot(7, 0); tick(2); return 0.11;
    case 'missiles': missileShot(); return 0.22;
    case 'ricochet': for (const a of [-0.38, 0.38]) shot(0, a, 640, { bounce: 3, ric: 1 }); tick(2); return 0.13;
    case 'plasma':   shot(0, 0, 470, { plasma: 1, pierce: 3, dmg: 3 * dm, hitSet: new Set() }); blip(rnd(160, 200), 0.12, 0.045, 80); return 0.2;
    case 'wave':     for (const s of [1, -1]) shot(0, 0, 700, { vx: 0, wave: 1, amp: 24 * s, x0: P.x, t: 0 }); tick(3); return 0.075;

  ctx.restore();
}
function drawHUD(now) {
  // timed-effect bars across the very top
  let by = 0;
  for (const [v, max, col] of [[P.shield, SHIELD_TIME, PU_COL.S], [P.laser, LASER_TIME, PU_COL.Z], [P.slow, SLOW_TIME, PU_COL.T], [P.magnet, MAGNET_TIME, PU_COL.M]]) {
    if (v <= 0) continue;
    const blink = v < 2 && Math.floor(now / 110) % 2;
    ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(0, by, W, 5);
    ctx.fillStyle = blink ? '#fff' : col; ctx.fillRect(0, by, W * Math.min(1, v / max), 5);
    by += 6;
  }
  text(score.toLocaleString(), 14, 30, 22, '#fff', 'left', 800);
  text('BEST ' + Math.max(best, score).toLocaleString(), 14, 48, 11, 'rgba(255,255,255,.55)', 'left', 600);
  for (let i = 0; i < MAIN_MAX; i++) {
    ctx.fillStyle = i < P.lvl ? GUNS[i + 1].col : 'rgba(255,255,255,.15)';
    ctx.fillRect(14 + i * 9, 56, 7, 5);
  }
  text(GUNS[P.lvl].name + (P.keep ? ' 🔒' : ''), 14 + MAIN_MAX * 9 + 4, 61, 9, GUNS[P.lvl].col, 'left', 900);
  P.wings.forEach((w, j) => {
    for (let i = 0; i < WING_MAX; i++) {
      ctx.fillStyle = i < w.lvl ? wingGunCol(WG[w.kind][i]) : 'rgba(255,255,255,.15)';
      ctx.fillRect(14 + (j % 2) * 52 + i * 9, 65 + Math.floor(j / 2) * 7, 7, 4);
    }
  });
  for (let i = 0; i < P.lives; i++) drawShip(W - 18 - i * 22, 24, 0.55, false, P.ship.col, P.ship.shape);
  for (let i = 0; i < P.bombs; i++) {
    const x = W - 18 - i * 22, y = 50;
    ctx.fillStyle = PU_COL.B; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
    text('B', x, y + 4, 10, '#fff');
  }
  const mult = comboMult();
  if (combo > 1) {
    text((mult > 1 ? 'x' + mult + '  ' : '') + combo + ' COMBO', W - 14, 80, mult > 1 ? 15 : 12, mult > 1 ? '#ffe14d' : 'rgba(255,255,255,.7)', 'right', 900);
    ctx.fillStyle = 'rgba(255,225,77,.6)'; ctx.fillRect(W - 14 - 70 * (comboT / 2.2), 85, 70 * (comboT / 2.2), 2);
  }
  if (boss) {
    const bw = W - 40, y = 94;
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(20, y, bw, 6);
    ctx.fillStyle = boss.col; ctx.fillRect(20, y, bw * Math.max(0, boss.hp / boss.maxhp), 6);
    text(boss.name + (podsUp(boss) ? '  🛡' : ''), 20, y - 4, 10, boss.col, 'left', 900);
  }
  if (bonus && bonus.started) text(`BONUS ${bonus.kills}/${bonus.total}`, W / 2, 104, 13, '#ffe14d', 'center', 900);
}
function overlay(a) { ctx.fillStyle = `rgba(5,6,15,${a})`; ctx.fillRect(0, 0, W, H); }

function draw(now) {
  ctx.save();
  if (shakeT > 0) { const m = shakeM * Math.min(1, shakeT * 3); ctx.translate(rnd(-m, m), rnd(-m, m)); }
  drawBG(now);

  if (state !== 'menu') {
    for (const p of pu) drawPU(p.x, p.y, p.k, 1 + Math.sin(p.t * 6) * 0.08);
    for (const e of en) if (e.boss) drawBeam(e, now);
    for (const e of en) drawEnemy(e, now);
    for (const e of en) if (e.boss) for (const w of e.captured) drawShip(w.x, w.y, 0.66, false, '#ff7a7a', 'ace', true);

    if (state === 'play' && P.laser > 0) {
      const wv = 9 + Math.sin(now / 30) * 2;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,61,242,.35)'; ctx.fillRect(P.x - wv, 0, wv * 2, P.y - 14);
      ctx.fillStyle = 'rgba(255,200,250,.9)'; ctx.fillRect(P.x - 2.5, 0, 5, P.y - 14);
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.globalCompositeOperation = 'lighter';
    for (const b of pb) {
      if (b.rocket) {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
        ctx.fillStyle = ROCKET_COL; ctx.fillRect(-6, -2, 10, 4); ctx.fillStyle = '#fff3b0'; ctx.fillRect(3, -1.5, 3, 3);
        ctx.restore();
      } else if (b.plasma) {
        ctx.fillStyle = 'rgba(192,123,255,.45)'; ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, 7); ctx.fill();
        ctx.fillStyle = '#f0e0ff'; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 7); ctx.fill();
      } else if (b.pellet) { ctx.fillStyle = GC.shotgun; ctx.beginPath(); ctx.arc(b.x, b.y, 2.6, 0, 7); ctx.fill(); }
      else if (b.boom) {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.spin); ctx.strokeStyle = GC.boomerang; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-9, 6); ctx.lineTo(0, -6); ctx.lineTo(9, 6); ctx.stroke(); ctx.lineCap = 'butt'; ctx.restore();
      } else if (b.mine) {
        const on = b.arm <= 0 && Math.floor(b.life * 8) % 2;
        ctx.fillStyle = 'rgba(255,77,109,.35)'; ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, 7); ctx.fill();
        ctx.fillStyle = on ? '#fff' : GC.mines; ctx.beginPath(); ctx.arc(b.x, b.y, 4.5, 0, 7); ctx.fill();
      } else if (b.hole) {
        ctx.globalCompositeOperation = 'source-over';
        const t = performance.now() / 1000;
        ctx.strokeStyle = 'rgba(155,92,255,.5)'; ctx.lineWidth = 2;
        for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(b.x, b.y, 16 + k * 9, t * (4 - k) + k, t * (4 - k) + k + 2.2); ctx.stroke(); }
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(b.x, b.y, 11, 0, 7); ctx.fill();
        ctx.strokeStyle = GC.blackhole; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(b.x, b.y, 12, 0, 7); ctx.stroke();
        ctx.globalCompositeOperation = 'lighter';
      } else if (b.rail) {
        ctx.fillStyle = 'rgba(160,240,255,.35)'; ctx.fillRect(b.x - 3, b.y, 6, 46);
        ctx.fillStyle = GC.railgun; ctx.fillRect(b.x - 1.5, b.y - 6, 3, 40);
      } else if (b.flak) { ctx.fillStyle = GC.flak; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3); }
      else if (b.frag) { ctx.fillStyle = GC.flak; ctx.fillRect(b.x - 2, b.y - 2, 4, 4); }
      else if (b.ric) { ctx.fillStyle = GC.ricochet; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx)); ctx.fillRect(-7, -1.5, 14, 3); ctx.restore(); }
      else if (b.wave) { ctx.fillStyle = GC.wave; ctx.beginPath(); ctx.arc(b.x, b.y, b.heavy ? 4 : 3, 0, 7); ctx.fill(); }
      else if (b.heavy) { ctx.fillStyle = '#ffc46b'; ctx.fillRect(b.x - 2.5, b.y - 9, 5, 16); }
      else { ctx.fillStyle = '#7ff3ff'; ctx.fillRect(b.x - 1.5, b.y - 8, 3, 14); }
    }
    for (const g of rings) { ctx.globalAlpha = Math.max(0, g.t / 0.3); ctx.strokeStyle = g.c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = GC.lightning; ctx.lineWidth = 2;
    for (const z of zaps) {
      ctx.globalAlpha = Math.min(1, z.t / 0.08);
      ctx.beginPath(); ctx.moveTo(z.x1, z.y1);
      for (let k = 1; k < 6; k++) { const f = k / 6; ctx.lineTo(z.x1 + (z.x2 - z.x1) * f + rnd(-9, 9), z.y1 + (z.y2 - z.y1) * f + rnd(-9, 9)); }
      ctx.lineTo(z.x2, z.y2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const b of eb) {
      ctx.fillStyle = b.c; ctx.globalAlpha = 0.45; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, 7); ctx.fill();
      ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, 7); ctx.fill();
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    if (state === 'play' && !(P.inv > 0 && P.shield <= 0 && Math.floor(P.inv * 14) % 2)) {
      if (GUNS[P.lvl].id === 'blades') for (let k = 0; k < 3; k++) {
        const a = (P.bladeA || 0) + k * Math.PI * 2 / 3, bx = P.x + Math.cos(a) * 44, by = P.y + Math.sin(a) * 44;
        ctx.save(); ctx.translate(bx, by); ctx.rotate(now / 40);
        ctx.fillStyle = GC.blades; ctx.beginPath();
        for (let j = 0; j < 16; j++) { const aa = j * Math.PI / 8, rr2 = j % 2 ? 6 : 10; ctx.lineTo(Math.cos(aa) * rr2, Math.sin(aa) * rr2); }
        ctx.closePath(); ctx.fill(); ctx.fillStyle = '#2a2f3a'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill(); ctx.restore();
      }
      for (const w of P.wings) drawShip(w.x, w.y, w.kind === 'rocket' ? 0.66 : 0.72, true, wingCol(w));
      drawShip(P.x, P.y, 1, true, P.ship.col, P.ship.shape);
      if (P.shield > 0 && !(P.shield < 3 && Math.floor(now / 110) % 2)) {
        ctx.strokeStyle = `rgba(76,201,255,${0.6 + 0.3 * Math.sin(now / 120)})`; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(P.x, P.y, 25, 0, 7); ctx.stroke();
      }
      if (P.magnet > 0) {
        ctx.strokeStyle = `rgba(180,255,61,${0.25 + 0.2 * Math.sin(now / 90)})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(P.x, P.y, 34 + (now / 20) % 14, 0, 7); ctx.stroke();
      }
    }
    for (const t of texts) { ctx.globalAlpha = Math.min(1, t.t * 2); text(t.s, t.x, t.y, 13, t.c, 'center', 800); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  if (state === 'play' && P.slow > 0) { ctx.fillStyle = 'rgba(90,110,255,.09)'; ctx.fillRect(0, 0, W, H); }
  if (flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${flashT * 1.6})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'play') {
    drawHUD(now);
    if (banners.length) {
      const b = banners[0];
      ctx.globalAlpha = Math.min(1, b.t * 2, (b.d - b.t) * 4 + 0.2);
      text(b.s, W / 2, H * 0.32, Math.min(24, W * 0.058), b.c, 'center', 900);
      ctx.globalAlpha = 1;
    }
    if (idle >= 0.25) {
      overlay(0.6);
      text('PAUSED', W / 2, H / 2 - 20, 34, '#fff', 'center', 900);
      text('Put your thumb back down to keep flying', W / 2, H / 2 + 14, 14, 'rgba(255,255,255,.75)', 'center', 500);
      text('Double-tap = bomb', W / 2, H / 2 + 36, 13, PU_COL.B, 'center', 700);
      for (const b of soundPills(H / 2 + 62)) drawPill(b, now);
    }
  } else if (state === 'menu') {
    const L = menuLayout();
    text('STAR THUMB', W / 2, L.titleY, Math.min(44, W * 0.105), '#2bd9ff', 'center', 900);
    text('pick your ship', W / 2, L.titleY + 22, 13, 'rgba(255,255,255,.6)', 'center', 600);
    L.cards.forEach((b, i) => drawCard(b, i, now));
    const fs = Math.min(13, W * 0.034);
    ['👍 Drag anywhere to fly · auto-fire', '✋ Lift to pause · 💥 double-tap = bomb', '🔫 Unlock 15 guns · then 4 wingmen']
      .forEach((s, i) => text(s, W / 2, L.instrY + i * 21, fs, 'rgba(255,255,255,.85)', 'center', 500));
    const keys = ['P', 'S', 'B', 'L', 'Z', 'T', 'M'], gap = Math.min(50, (W - 16) / 7), sx = W / 2 - gap * 3;
    keys.forEach((k, i) => { drawPU(sx + i * gap, L.legendY, k, 0.85); text(PU_NAME[k], sx + i * gap, L.legendY + 26, 9.5, 'rgba(255,255,255,.6)', 'center', 600); });
    for (const b of soundPills(L.pillsY)) drawPill(b, now);
    ctx.globalAlpha = 0.85 + 0.15 * Math.sin(now / 250); drawPill(L.start, now); ctx.globalAlpha = 1;
    if (best > 0) text('BEST ' + best.toLocaleString(), W / 2, L.start.y + L.start.h + 20, 12, 'rgba(255,255,255,.5)', 'center', 600);
  } else if (state === 'over') {
    overlay(0.6);
    const y = H * 0.24;
    text('GAME OVER', W / 2, y, 38, '#ff4d6d', 'center', 900);
    text(score.toLocaleString(), W / 2, y + 54, 44, '#fff', 'center', 900);
    text(newBest ? '★ NEW BEST! ★' : 'BEST ' + best.toLocaleString(), W / 2, y + 84, 15, newBest ? '#ffd23f' : 'rgba(255,255,255,.6)', 'center', 700);
    text(`Reached ${ZONES[zone].name} · ${bossCount} boss${bossCount === 1 ? '' : 'es'} · max combo x${maxMult}`, W / 2, y + 110, 12, 'rgba(255,255,255,.6)', 'center', 600);
    if (performance.now() - overT > 900) {
      const L = overLayout();
      drawPill(L.again, now); drawPill(L.ships, now);
      for (const b of soundPills(L.pillsY)) drawPill(b, now);
    }
  }
}

/* ================= loop ================= */
function safe(fn, a) { try { fn(a); } catch (e) { console.error(e); } }
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play') {
    if (touching) idle = 0; else idle += dt;
    const paused = idle >= 0.25;
    if (paused !== wasPaused) { wasPaused = paused; if (paused) stopLaserHum(); else if (P.laser > 0) laserHum(P.laser); }
    if (!paused) safe(step, dt);
  } else { wasPaused = false; safe(step, dt); }
  safe(musicTick);
  safe(draw, now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>

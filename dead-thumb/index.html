const pick = a => a[Math.floor(Math.random() * a.length)];
const _shc = {};
function shade(hex, f) {               // f < 0 darkens, f > 0 lightens
  const k = hex + f; if (_shc[k]) return _shc[k];
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return (_shc[k] = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1));
}

        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - c * 4, b.y - sn * 4); ctx.stroke();
        ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(b.x - c * 18 - sn * 3, b.y - sn * 18 + c * 3); ctx.lineTo(b.x - c * 22 + sn * 3, b.y - sn * 22 - c * 3); ctx.stroke();
      } else if (b.gren) { circle(b.x, b.y, 6, '#5f8a3a'); circle(b.x, b.y, 2.5, Math.floor(b.fuse * 12) % 2 ? '#ff4d4d' : '#fff'); }
      else {
        const a = Math.atan2(b.vy, b.vx), len = b.rail ? 26 : 12;
        ctx.strokeStyle = b.rail ? '#e8fbff' : '#ffe08a'; ctx.lineWidth = b.rail ? 3 : 2.5;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - Math.cos(a) * len, b.y - Math.sin(a) * len); ctx.stroke();
      }
    }
    for (const g of rings) { ctx.globalAlpha = Math.max(0, g.t / 0.3); ctx.strokeStyle = g.c; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, TAU); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    for (const b of eb) {
      ctx.globalAlpha = 0.4; circle(b.x, b.y, b.r + 3, b.c);
      ctx.globalAlpha = 1; circle(b.x, b.y, b.r, b.c); circle(b.x - 1.5, b.y - 1.5, b.r * 0.35, '#fff');
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); }
    ctx.globalAlpha = 1;
    for (const t of texts) { ctx.globalAlpha = Math.min(1, t.t * 2); text(t.s, t.x, t.y, 13, t.c, 'center', 800); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
  if (state === 'play' && P.freeze > 0) { ctx.fillStyle = 'rgba(140,200,255,.08)'; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' && P.hp === 1 && Math.sin(now / 250) > 0) { ctx.fillStyle = 'rgba(255,0,0,.06)'; ctx.fillRect(0, 0, W, H); }
  if (flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${flashT * 1.6})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'play') {
    drawHUD(now);
    if (banners.length) {
      const b = banners[0];
      ctx.globalAlpha = Math.min(1, b.t * 2, (b.d - b.t) * 4 + 0.2);
      text(b.s, W / 2, H * 0.32, Math.min(24, W * 0.058), b.c, 'center', 900);
      ctx.globalAlpha = 1;
    }
    if (idle >= 0.25) {
      overlay(0.6);
      text('PAUSED', W / 2, H / 2 - 20, 34, '#fff', 'center', 900);
      text('Put your thumb back down to keep moving', W / 2, H / 2 + 14, 14, 'rgba(255,255,255,.75)', 'center', 500);
      text('Double-tap = grenade', W / 2, H / 2 + 36, 13, PU_COL.B, 'center', 700);
      for (const b of soundPills(H / 2 + 62)) drawPill(b);
      drawPill(crewBtn());
      text('special · once every 60s', W / 2, H / 2 + 186, 11, 'rgba(255,255,255,.5)', 'center', 600);
    }
  } else if (state === 'menu') {
    for (const z of zs) drawZombie(z, now);
    overlay(0.45);
    const L = menuLayout();
    text('DEAD THUMB', W / 2, L.titleY, Math.min(44, W * 0.105), GOO, 'center', 900);
    text('pick your survivor', W / 2, L.titleY + 22, 13, 'rgba(255,255,255,.6)', 'center', 600);
    L.cards.forEach((b, i) => drawCard(b, i, now));
    const fs = Math.min(13, W * 0.034);
    ['👍 Drag anywhere to move · auto-aim & fire', '✋ Lift to pause · 💥 double-tap = grenade', '🔫 Gun parts unlock 13 guns · P = partner']
      .forEach((s, i) => text(s, W / 2, L.instrY + i * 21, fs, 'rgba(255,255,255,.85)', 'center', 500));
    const keys = ['G', 'H', 'B', 'A', 'F', 'P'], gap = Math.min(58, (W - 16) / 6), sx = W / 2 - gap * 2.5;
    keys.forEach((k, i) => { drawPU(sx + i * gap, L.legendY, k, 0.85); text(PU_NAME[k], sx + i * gap, L.legendY + 26, 9.5, 'rgba(255,255,255,.6)', 'center', 600); });
    for (const b of soundPills(L.pillsY)) drawPill(b);
    ctx.globalAlpha = 0.85 + 0.15 * Math.sin(now / 250); drawPill(L.start); ctx.globalAlpha = 1;
    if (best > 0) text('BEST ' + best.toLocaleString(), W / 2, L.start.y + L.start.h + 20, 12, 'rgba(255,255,255,.5)', 'center', 600);
  } else if (state === 'over') {
    overlay(0.6);
    const y = H * 0.24;
    text('YOU GOT BIT', W / 2, y, 36, '#ff4d6d', 'center', 900);
    text(score.toLocaleString(), W / 2, y + 54, 44, '#fff', 'center', 900);
    text(newBest ? '★ NEW BEST! ★' : 'BEST ' + best.toLocaleString(), W / 2, y + 84, 15, newBest ? '#ffd23f' : 'rgba(255,255,255,.6)', 'center', 700);
    text(`${ZONES[zone].name} · ${kills} zombies · ${bossCount} boss${bossCount === 1 ? '' : 'es'} · combo x${maxMult}`, W / 2, y + 110, 12, 'rgba(255,255,255,.6)', 'center', 600);
    if (performance.now() - overT > 900) {
      const L = overLayout();
      drawPill(L.again); drawPill(L.heroes);
      for (const b of soundPills(L.pillsY)) drawPill(b);
    }
  }
}

/* ================= menu ambience ================= */
let menuT = 0;
function menuZombies(dt) {
  menuT -= dt;
  if (menuT <= 0 && zs.length < 8) { menuT = rnd(0.8, 1.6); const z = mkZ(Math.random() < 0.7 ? 'walker' : 'runner', rnd(20, W - 20), -30, 1); z.menu = true; z.sp *= 0.6; zs.push(z); }
  for (let i = zs.length - 1; i >= 0; i--) {
    const z = zs[i]; z.t += dt; z.ang = Math.PI / 2 + Math.sin(z.t * z.wob) * 0.3;
    z.x += Math.cos(z.ang) * z.sp * dt; z.y += Math.sin(z.ang) * z.sp * dt;
    if (z.y > H + 40) zs.splice(i, 1);
  }
}

/* ================= loop ================= */
function safe(fn, a) { try { fn(a); } catch (e) { console.error(e); } }
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play') {
    if (touching) idle = 0; else idle += dt;
    if (idle < 0.25) safe(step, dt);
  } else {
    safe(step, dt);
    if (state === 'menu') { safe(menuZombies, dt); }
  }
  safe(musicTick);
  safe(menuMusicTick);
  safe(draw, now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

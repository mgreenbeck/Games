const pick = a => a[Math.floor(Math.random() * a.length)];
const _shc = {};
function shade(hex, f) {               // f < 0 darkens, f > 0 lightens
  const k = hex + f; if (_shc[k]) return _shc[k];
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return (_shc[k] = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1));
}

  else if (look === 1) { circle(0, 0, 5.8, '#c0282e'); circle(-1.5, -2, 0.7, '#fff'); circle(1.5, 2.2, 0.7, '#fff'); ctx.fillStyle = '#c0282e'; ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(-10, -3); ctx.lineTo(-9, 3); ctx.fill(); }   // bandana
  else if (look === 2) { circle(0, 0, 5.9, '#555a63'); ctx.strokeStyle = '#3d4149'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.stroke(); circle(0, 0, 1.8, '#3d4149'); }  // beanie
  else { circle(-0.8, 0, 5.4, '#111'); ctx.strokeStyle = '#333'; ctx.lineWidth = 0.7; for (const k of [-2, 0, 2]) { ctx.beginPath(); ctx.moveTo(4, k); ctx.lineTo(-5, k * 1.2); ctx.stroke(); } }   // slicked hair
  ctx.restore();
}
function drawCar(d, now) {
  const L = d.L, Wd = d.Wd, col = d.col, rot = d.dir < 0 ? Math.PI : 0;
  ctx.save(); ctx.translate(d.x, d.y);
  ctx.fillStyle = 'rgba(0,0,0,.42)'; ctx.beginPath(); ctx.ellipse(6, 10 + d.hop * 6, L * 0.53, Wd * 0.58, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -d.hop * 6); ctx.scale(1 + d.hop * 0.04, 1 + d.hop * 0.04); ctx.rotate(rot);
  // wheels with spinning chrome wire rims
  for (const wx of [0.31, -0.31]) for (const wy of [-1, 1]) {
    const cx = wx * L, cy = wy * Wd * 0.5;
    ctx.fillStyle = '#0d0d0d'; rr(cx - 13, cy - 7, 26, 14, 5); ctx.fill();
    ctx.fillStyle = '#d8dde6'; rr(cx - 9, cy - 5, 18, 10, 4); ctx.fill();
    ctx.strokeStyle = '#8a929e'; ctx.lineWidth = 1; const sp = now / 40;
    for (let k = 0; k < 4; k++) { const ox = Math.cos(sp + k * 0.8) * 8; ctx.beginPath(); ctx.moveTo(cx + ox, cy - 5); ctx.lineTo(cx - ox, cy + 5); ctx.stroke(); }
  }
  // body
  ctx.fillStyle = shade(col, -0.4); rr(-L / 2, -Wd / 2, L, Wd, 18); ctx.fill();
  ctx.fillStyle = col; rr(-L / 2 + 3, -Wd / 2 + 3, L - 6, Wd - 6, 15); ctx.fill();
  ctx.fillStyle = shade(col, 0.25); rr(-L / 2 + 8, -Wd / 2 + 5, L - 16, 6, 3); ctx.fill();
  // hood flames
  ctx.fillStyle = '#ffb000';
  ctx.beginPath(); ctx.moveTo(L * 0.47, -Wd * 0.28);
  for (let k = 0; k <= 6; k++) ctx.lineTo(L * (0.47 - k * 0.045), (k % 2 ? 0.05 : -0.3) * Wd);
  for (let k = 6; k >= 0; k--) ctx.lineTo(L * (0.47 - k * 0.045), (k % 2 ? -0.05 : 0.3) * Wd);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff5a1f'; ctx.beginPath(); ctx.moveTo(L * 0.47, -Wd * 0.14); ctx.lineTo(L * 0.25, 0); ctx.lineTo(L * 0.47, Wd * 0.14); ctx.fill();
  ctx.strokeStyle = shade(col, -0.3); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L * 0.2, -Wd * 0.4); ctx.lineTo(L * 0.2, Wd * 0.4); ctx.moveTo(-L * 0.38, -Wd * 0.4); ctx.lineTo(-L * 0.38, Wd * 0.4); ctx.stroke();
  // chrome bumpers, lights
  ctx.fillStyle = '#e6eaf0'; rr(L / 2 - 5, -Wd * 0.42, 7, Wd * 0.84, 3); ctx.fill(); rr(-L / 2 - 2, -Wd * 0.4, 6, Wd * 0.8, 3); ctx.fill();
  circle(L / 2 - 7, -Wd * 0.3, 4.5, '#fffbe0'); circle(L / 2 - 7, Wd * 0.3, 4.5, '#fffbe0');
  ctx.fillStyle = '#ff2030'; ctx.fillRect(-L / 2 + 2, -Wd * 0.38, 4, 9); ctx.fillRect(-L / 2 + 2, Wd * 0.38 - 9, 4, 9);
  // windshield
  ctx.fillStyle = 'rgba(170,220,255,.55)'; ctx.beginPath(); ctx.moveTo(L * 0.17, -Wd * 0.4); ctx.lineTo(L * 0.2, -Wd * 0.36); ctx.lineTo(L * 0.2, Wd * 0.36); ctx.lineTo(L * 0.17, Wd * 0.4); ctx.lineTo(L * 0.12, Wd * 0.38); ctx.lineTo(L * 0.12, -Wd * 0.38); ctx.fill();
  ctx.fillStyle = '#c9ced6'; ctx.fillRect(L * 0.115, -Wd * 0.4, 2, Wd * 0.8);
  // convertible interior
  ctx.fillStyle = '#2a140c'; rr(-L * 0.36, -Wd * 0.38, L * 0.47, Wd * 0.76, 8); ctx.fill();
  ctx.fillStyle = '#e8d8b8';
  for (const sx of [0.02, -0.24]) for (const sy of [-0.22, 0.22]) { rr(sx * L - 9, sy * Wd - 9, 15, 18, 4); ctx.fill(); }
  ctx.fillStyle = '#d4af37'; ctx.fillRect(-L * 0.12, -2, L * 0.18, 4);
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(L * 0.09, -Wd * 0.22, 6.5, 0, TAU); ctx.stroke();
  // driver leaning back, arm out the window
  ctx.strokeStyle = '#6b4226'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(L * 0.04, -Wd * 0.3); ctx.lineTo(L * 0.06, -Wd * 0.52); ctx.stroke(); ctx.lineCap = 'butt';
  drawGangster(L * 0.04, -Wd * 0.22, 0, 3, false, 0);
  for (const c of d.crew) drawGangster(c.lx * L, c.ly * Wd, c.ang - rot, c.look, true, c.muzzle);
  ctx.restore();
  if (d.bubble) {
    ctx.font = `900 13px ${FONT}`;
    const tw = ctx.measureText(d.bubble.s).width + 18, bx = clamp(d.x, tw / 2 + 6, W - tw / 2 - 6), by = d.y - Wd / 2 - 40;
    const tx = clamp(d.x, bx - tw / 2 + 12, bx + tw / 2 - 12);
    ctx.globalAlpha = Math.min(1, d.bubble.t * 3);
    ctx.fillStyle = '#fff'; rr(bx - tw / 2, by - 14, tw, 26, 10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx - 6, by + 11); ctx.lineTo(tx, by + 22); ctx.lineTo(tx + 6, by + 11); ctx.fill();
    ctx.textBaseline = 'middle'; text(d.bubble.s, bx, by, 13, '#111', 'center', 900); ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  }
}
function reloadRing(x, y, r, f, c) {
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(f, 0, 1)); ctx.stroke();
}
function overlay(a) { ctx.fillStyle = `rgba(8,10,6,${a})`; ctx.fillRect(0, 0, W, H); }

function draw(now) {
  ctx.save();
  if (shakeT > 0) { const m = shakeM * Math.min(1, shakeT * 3); ctx.translate(rnd(-m, m), rnd(-m, m)); }
  drawGround();

  if (state !== 'menu') {
    for (const p of pu) drawPU(p.x, p.y, p.k, 1 + Math.sin(p.t * 6) * 0.08);
    for (const z of zs) if (!z.boss) drawZombie(z, now);
    for (const z of zs) if (z.boss) drawBoss(z, now);
    if (state === 'play' && driveBy) drawCar(driveBy, now);
    if (state === 'play') for (const m of P.mates) {
      drawSurvivor(m.x, m.y, 1.2, m.aim, m.col, 1, m.walk, m.muzzle, m.look);
      if (m.reload > 0) reloadRing(m.x, m.y, 20, 1 - m.reload / MATE_RELOAD, m.col);
      if (m.tgt && alive(m.tgt)) { ctx.strokeStyle = m.col; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(m.tgt.x, m.tgt.y, m.tgt.r + 5, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }
    }
    if (state === 'play' && !(P.inv > 0 && P.armor <= 0 && Math.floor(P.inv * 14) % 2)) {
      drawSurvivor(P.x, P.y, 1.35 * (P.hero === HEROES[2] ? 1.12 : P.hero === HEROES[0] ? 0.9 : 1), P.aim, P.hero.col, P.lvl, P.walk, P.muzzle);
      if (P.reload > 0) { reloadRing(P.x, P.y, 34, 1 - P.reload / P.reloadMax, '#ffe08a'); text('RELOADING', P.x, P.y - 40, 10, '#ffe08a', 'center', 900); }
      if (P.armor > 0) { ctx.strokeStyle = `rgba(76,201,255,${0.5 + 0.3 * Math.sin(now / 120)})`; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(P.x, P.y, 29, 0, TAU); ctx.stroke(); }
    }
    if (state === 'play' && P.tgt && alive(P.tgt)) {
      const t = P.tgt, rr2 = t.r + 6, a = now / 300;
      ctx.strokeStyle = 'rgba(255,80,80,.55)'; ctx.lineWidth = 1.5;
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(t.x, t.y, rr2, a + k * Math.PI / 2, a + k * Math.PI / 2 + 0.7); ctx.stroke(); }
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const b of pb) {
      if (b.flame) {
        const k = Math.max(0, b.life / 0.4);
        circle(b.x, b.y, b.r * 1.6, `rgba(255,90,20,${0.25 * k})`); circle(b.x, b.y, b.r, `rgba(255,190,60,${0.6 * k})`);
      } else if (b.bolt) {
        const a = Math.atan2(b.vy, b.vx), c = Math.cos(a), sn = Math.sin(a);
        ctx.strokeStyle = '#d9a66b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - c * 22, b.y - sn * 22); ctx.stroke();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - c * 4, b.y - sn * 4); ctx.stroke();
        ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(b.x - c * 18 - sn * 3, b.y - sn * 18 + c * 3); ctx.lineTo(b.x - c * 22 + sn * 3, b.y - sn * 22 - c * 3); ctx.stroke();
      } else if (b.gren) { circle(b.x, b.y, 6, '#5f8a3a'); circle(b.x, b.y, 2.5, Math.floor(b.fuse * 12) % 2 ? '#ff4d4d' : '#fff'); }
      else {
        const a = Math.atan2(b.vy, b.vx), len = b.rail ? 26 : 12;
        ctx.strokeStyle = b.rail ? '#e8fbff' : '#ffe08a'; ctx.lineWidth = b.rail ? 3 : 2.5;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - Math.cos(a) * len, b.y - Math.sin(a) * len); ctx.stroke();
      }
    }
    for (const g of rings) { ctx.globalAlpha = Math.max(0, g.t / 0.3); ctx.strokeStyle = g.c; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, TAU); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    for (const b of eb) {
      ctx.globalAlpha = 0.4; circle(b.x, b.y, b.r + 3, b.c);
      ctx.globalAlpha = 1; circle(b.x, b.y, b.r, b.c); circle(b.x - 1.5, b.y - 1.5, b.r * 0.35, '#fff');
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); }
    ctx.globalAlpha = 1;
    for (const t of texts) { ctx.globalAlpha = Math.min(1, t.t * 2); text(t.s, t.x, t.y, 13, t.c, 'center', 800); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
  if (state === 'play' && P.freeze > 0) { ctx.fillStyle = 'rgba(140,200,255,.08)'; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' && P.hp === 1 && Math.sin(now / 250) > 0) { ctx.fillStyle = 'rgba(255,0,0,.06)'; ctx.fillRect(0, 0, W, H); }
  if (flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${flashT * 1.6})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'play') {
    drawHUD(now);
    if (banners.length) {
      const b = banners[0];
      ctx.globalAlpha = Math.min(1, b.t * 2, (b.d - b.t) * 4 + 0.2);
      text(b.s, W / 2, H * 0.32, Math.min(24, W * 0.058), b.c, 'center', 900);
      ctx.globalAlpha = 1;
    }
    if (idle >= 0.25) {
      overlay(0.6);
      text('PAUSED', W / 2, H / 2 - 20, 34, '#fff', 'center', 900);
      text('Put your thumb back down to keep moving', W / 2, H / 2 + 14, 14, 'rgba(255,255,255,.75)', 'center', 500);
      text('Double-tap = grenade', W / 2, H / 2 + 36, 13, PU_COL.B, 'center', 700);
      for (const b of soundPills(H / 2 + 62)) drawPill(b);
      drawPill(crewBtn());
      text('special · once every 60s', W / 2, H / 2 + 186, 11, 'rgba(255,255,255,.5)', 'center', 600);
    }
  } else if (state === 'menu') {
    for (const z of zs) drawZombie(z, now);
    overlay(0.45);
    const L = menuLayout();
    text('DEAD THUMB', W / 2, L.titleY, Math.min(44, W * 0.105), GOO, 'center', 900);
    text('pick your survivor', W / 2, L.titleY + 22, 13, 'rgba(255,255,255,.6)', 'center', 600);
    L.cards.forEach((b, i) => drawCard(b, i, now));
    const fs = Math.min(13, W * 0.034);
    ['👍 Drag anywhere to move · auto-aim & fire', '✋ Lift to pause · 💥 double-tap = grenade', '🔫 Gun parts unlock 13 guns · P = partner']
      .forEach((s, i) => text(s, W / 2, L.instrY + i * 21, fs, 'rgba(255,255,255,.85)', 'center', 500));
    const keys = ['G', 'H', 'B', 'A', 'F', 'P'], gap = Math.min(58, (W - 16) / 6), sx = W / 2 - gap * 2.5;
    keys.forEach((k, i) => { drawPU(sx + i * gap, L.legendY, k, 0.85); text(PU_NAME[k], sx + i * gap, L.legendY + 26, 9.5, 'rgba(255,255,255,.6)', 'center', 600); });
    for (const b of soundPills(L.pillsY)) drawPill(b);
    ctx.globalAlpha = 0.85 + 0.15 * Math.sin(now / 250); drawPill(L.start); ctx.globalAlpha = 1;
    if (best > 0) text('BEST ' + best.toLocaleString(), W / 2, L.start.y + L.start.h + 20, 12, 'rgba(255,255,255,.5)', 'center', 600);
  } else if (state === 'over') {
    overlay(0.6);
    const y = H * 0.24;
    text('YOU GOT BIT', W / 2, y, 36, '#ff4d6d', 'center', 900);
    text(score.toLocaleString(), W / 2, y + 54, 44, '#fff', 'center', 900);
    text(newBest ? '★ NEW BEST! ★' : 'BEST ' + best.toLocaleString(), W / 2, y + 84, 15, newBest ? '#ffd23f' : 'rgba(255,255,255,.6)', 'center', 700);
    text(`${ZONES[zone].name} · ${kills} zombies · ${bossCount} boss${bossCount === 1 ? '' : 'es'} · combo x${maxMult}`, W / 2, y + 110, 12, 'rgba(255,255,255,.6)', 'center', 600);
    if (performance.now() - overT > 900) {
      const L = overLayout();
      drawPill(L.again); drawPill(L.heroes);
      for (const b of soundPills(L.pillsY)) drawPill(b);
    }
  }
}

/* ================= menu ambience ================= */
let menuT = 0;
function menuZombies(dt) {
  menuT -= dt;
  if (menuT <= 0 && zs.length < 8) { menuT = rnd(0.8, 1.6); const z = mkZ(Math.random() < 0.7 ? 'walker' : 'runner', rnd(20, W - 20), -30, 1); z.menu = true; z.sp *= 0.6; zs.push(z); }
  for (let i = zs.length - 1; i >= 0; i--) {
    const z = zs[i]; z.t += dt; z.ang = Math.PI / 2 + Math.sin(z.t * z.wob) * 0.3;
    z.x += Math.cos(z.ang) * z.sp * dt; z.y += Math.sin(z.ang) * z.sp * dt;
    if (z.y > H + 40) zs.splice(i, 1);
  }
}

/* ================= loop ================= */
function safe(fn, a) { try { fn(a); } catch (e) { console.error(e); } }
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play') {
    if (touching) idle = 0; else idle += dt;
    if (idle < 0.25) safe(step, dt);
  } else {
    safe(step, dt);
    if (state === 'menu') { safe(menuZombies, dt); }
  }
  safe(musicTick);
  safe(draw, now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Orbit Flip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
  html,body{margin:0;height:100%;background:#0B1020;overflow:hidden;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #game{width:390px;height:844px;position:relative;overflow:hidden;background:#0B1020;font-family:'Space Grotesk',system-ui,sans-serif;color:#F4F1EA;user-select:none;-webkit-user-select:none;touch-action:manipulation;transform-origin:center center;flex:none}
  .abs{position:absolute}
  #score-box{left:0;right:0;top:56px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .label{font-size:13px;letter-spacing:3px;color:#A9B3D1}
  #score{font-size:64px;font-weight:700;line-height:1}
  #best{font-size:13px;color:#A9B3D1}
  .ring{border-radius:50%;border:2px solid #2A3558}
  .star{width:26px;height:26px;margin:-13px 0 0 -13px}
  .spike{width:20px;height:20px;margin:-10px 0 0 -10px;background:#FF6B4A;border-radius:4px;transform:rotate(45deg);box-shadow:0 0 12px rgba(255,107,74,.6)}
  #player{width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#F4F1EA;box-shadow:0 0 18px rgba(244,241,234,.7)}
  .panel{left:24px;right:24px;bottom:120px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .go{margin-top:8px;font-size:15px;font-weight:700;color:#FFC94A;letter-spacing:2px}
  #tap{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <div id="score-box" class="abs">
      <div class="label">SCORE</div>
      <div id="score">0</div>
      <div id="best">Best 0</div>
    </div>
    <div class="abs ring" style="left:45px;top:280px;width:296px;height:296px"></div>
    <div class="abs ring" style="left:100px;top:335px;width:186px;height:186px"></div>
    <div class="abs" style="left:175px;top:410px;width:40px;height:40px;border-radius:50%;background:#1A2240"></div>
    <div id="items"></div>
    <div id="player" class="abs"></div>
    <div id="ready" class="abs panel">
      <div style="font-size:40px;font-weight:700">Orbit Flip</div>
      <div style="font-size:17px;color:#C9D0E6;line-height:1.4">Tap anywhere to flip between the two rings.<br>Grab the stars. Dodge the red spikes.</div>
      <div class="go">TAP TO START</div>
    </div>
    <div id="over" class="abs panel" style="display:none">
      <div style="font-size:36px;font-weight:700;color:#FF8A70">Crashed!</div>
      <div id="over-line" style="font-size:17px;color:#C9D0E6"></div>
      <div class="go">TAP TO PLAY AGAIN</div>
    </div>
    <button id="tap" type="button" aria-label="Flip rings"></button>
  </div>
</div>
<script>
(function () {
  var CX = 195, CY = 430, R = [93, 148];
  var STAR_SVG = '<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#FFC94A"></path></svg>';
  var $ = function (id) { return document.getElementById(id); };
  var game = $('game'), itemsEl = $('items'), player = $('player');
  var best = 0;
  try { best = parseInt(localStorage.getItem('orbitFlipBest') || '0', 10) || 0; } catch (e) {}
  var g, last = 0, nodes = {};

  function fit() {
    var s = Math.min(window.innerWidth / 390, window.innerHeight / 844);
    game.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  function reset() {
    g = { phase: 'play', angle: -Math.PI / 2, lane: 1, r: R[1], items: [], next: -Math.PI / 2 + 1.3, speed: 1.5, score: 0, id: 0, overAt: 0 };
    spawn();
  }
  function spawn() {
    while (g.next < g.angle + Math.PI * 2 * 0.82) {
      var lane = Math.random() < 0.5 ? 0 : 1;
      var kind = Math.random() < 0.62 ? 'spike' : 'star';
      g.items.push({ id: g.id++, ang: g.next, lane: lane, kind: kind });
      g.next += 0.55 + Math.random() * 0.4;
    }
  }
  function tap(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (g.phase === 'play') { g.lane = 1 - g.lane; return; }
    if (g.phase === 'over' && performance.now() - g.overAt < 450) return;
    reset();
  }
  $('tap').addEventListener('pointerdown', tap);

  function tick(t) {
    var dt = last ? Math.min((t - last) / 1000, 0.05) : 0;
    last = t;
    if (g.phase === 'play') {
      g.speed = Math.min(1.5 + g.score * 0.05, 2.7);
      g.angle += g.speed * dt;
      var target = R[g.lane];
      g.r += (target - g.r) * Math.min(1, dt * 20);
      var keep = [];
      for (var i = 0; i < g.items.length; i++) {
        var it = g.items[i];
        if (it.ang < g.angle - 0.5) continue;
        var ir = R[it.lane];
        var arc = Math.abs(it.ang - g.angle) * ir;
        if (arc < 18 && Math.abs(g.r - ir) < 22) {
          if (it.kind === 'star') { g.score += 1; continue; }
          g.phase = 'over'; g.overAt = performance.now();
          if (g.score > best) { best = g.score; try { localStorage.setItem('orbitFlipBest', String(best)); } catch (e) {} }
        }
        keep.push(it);
      }
      g.items = keep;
      spawn();
    } else if (g.phase === 'ready') {
      g.angle += 0.6 * dt;
      g.next = g.angle + 1.3;
      g.items = [];
    }
    render();
    requestAnimationFrame(tick);
  }

  function render() {
    $('score').textContent = g.score;
    $('best').textContent = 'Best ' + best;
    var seen = {};
    var list = g.phase === 'ready' ? [] : g.items;
    for (var i = 0; i < list.length; i++) {
      var it = list[i], r = R[it.lane];
      var el = nodes[it.id];
      if (!el) {
        el = document.createElement('div');
        el.className = 'abs ' + it.kind;
        if (it.kind === 'star') el.innerHTML = STAR_SVG;
        itemsEl.appendChild(el);
        nodes[it.id] = el;
      }
      el.style.left = (CX + r * Math.cos(it.ang)).toFixed(1) + 'px';
      el.style.top = (CY + r * Math.sin(it.ang)).toFixed(1) + 'px';
      seen[it.id] = true;
    }
    for (var id in nodes) {
      if (!seen[id]) { itemsEl.removeChild(nodes[id]); delete nodes[id]; }
    }
    player.style.left = (CX + g.r * Math.cos(g.angle)).toFixed(1) + 'px';
    player.style.top = (CY + g.r * Math.sin(g.angle)).toFixed(1) + 'px';
    player.style.background = g.phase === 'over' ? '#FF6B4A' : '#F4F1EA';
    $('ready').style.display = g.phase === 'ready' ? 'flex' : 'none';
    $('over').style.display = g.phase === 'over' ? 'flex' : 'none';
    $('over-line').textContent = g.score === 1 ? 'You grabbed 1 star.' : 'You grabbed ' + g.score + ' stars.';
  }

  reset();
  g.phase = 'ready';
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
